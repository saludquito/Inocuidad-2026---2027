<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Inocuidad Alimentaria 2026 - 2027</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f2f4f7;
    }

    /* ==========================
       PANTALLA DE ACCESO
       ========================== */

    #loginScreen {

        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background:
            linear-gradient(
                135deg,
                #eef3f7,
                #dfe8ee
            );
    }

    .loginBox {

        width: 90%;
        max-width: 420px;

        background: white;

        padding: 40px;

        border-radius: 14px;

        box-shadow:
            0 6px 25px
            rgba(0,0,0,0.15);

        text-align: center;
    }

    .loginBox h1 {

        margin-top: 0;

        font-size: 24px;

        color: #333;
    }

    .loginBox p {

        color: #666;

        margin-bottom: 25px;
    }

    .loginBox input {

        width: 100%;

        padding: 14px;

        font-size: 16px;

        border: 1px solid #ccc;

        border-radius: 7px;

        outline: none;

        margin-bottom: 15px;
    }

    .loginBox input:focus {

        border-color: #1f78b4;
    }

    .loginBox button {

        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 7px;

        background: #1f78b4;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;
    }

    .loginBox button:hover {

        background: #155d8b;
    }

    #mensajeError {

        display: none;

        margin-top: 15px;

        color: #c62828;

        font-weight: bold;
    }

    /* ==========================
       EXPERIENCE BUILDER
       ========================== */

    #experienceContainer {

        display: none;

        width: 100vw;
        height: 100vh;
    }

    #experienceFrame {

        width: 100%;
        height: 100%;

        border: none;

        display: block;
    }

</style>

</head>

<body>


<!-- ==========================
     LOGIN
     ========================== -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>Inocuidad Alimentaria</h1>

        <p>
            Ingrese la contraseña para acceder al visualizador
        </p>

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="off"
        >

        <button onclick="verificarPassword()">
            Ingresar
        </button>

        <div id="mensajeError">
            Contraseña incorrecta
        </div>

    </div>

</div>


<!-- ==========================
     EXPERIENCE BUILDER
     ========================== -->

<div id="experienceContainer">

    <iframe

        id="experienceFrame"

        src="https://experience.arcgis.com/experience/7454208733b64dcbb8f21802dedd83fc"

        allowfullscreen

    ></iframe>

</div>


<script>

/* ==========================
   CONFIGURACIÓN
   ========================== */

const PASSWORD = "Inocuidad 2026";


/* ==========================
   VERIFICAR CONTRASEÑA
   ========================== */

function verificarPassword() {

    const passwordIngresado =
        document.getElementById("password").value;

    const mensajeError =
        document.getElementById("mensajeError");


    if (passwordIngresado === PASSWORD) {

        sessionStorage.setItem(
            "accesoInocuidad",
            "autorizado"
        );

        mostrarExperience();

    } else {

        mensajeError.style.display = "block";

        document.getElementById("password").value = "";

        document.getElementById("password").focus();

    }

}


/* ==========================
   MOSTRAR EXPERIENCE
   ========================== */

function mostrarExperience() {

    document.getElementById(
        "loginScreen"
    ).style.display = "none";

    document.getElementById(
        "experienceContainer"
    ).style.display = "block";

}


/* ==========================
   ENTER PARA INGRESAR
   ========================== */

document.getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                verificarPassword();

            }

        }
    );


/* ==========================
   MANTENER SESIÓN
   ========================== */

window.onload = function() {

    const acceso =
        sessionStorage.getItem(
            "accesoInocuidad"
        );

    if (acceso === "autorizado") {

        mostrarExperience();

    } else {

        document.getElementById(
            "password"
        ).focus();

    }

};

</script>


</body>

</html>
